spring:
  application:
    name: zomato-clone
  profiles:
    active: dev

app:
  jwt:
    # 512-bit HS512 secret key base64 encoded for security
    secret: dGhpc2lzYWJlYXV0aWZ1bHNlY3JldGtleWZvcnpvbWF0b2Nsb25lYXBwbGljYXRpb25wcm9kdWN0aW9ucXVhbGl0eWNvZGU=
    # 15 minutes (in milliseconds)
    accessTokenExpirationMs: 900000
    # 7 days (in milliseconds)
    refreshTokenExpirationMs: 604800000

server:
  port: 8080
  error:
    include-message: always

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:zomato_db;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/zomato_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
